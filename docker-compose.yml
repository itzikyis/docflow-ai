# Local development stack. Dependencies (PostgreSQL, Pub/Sub emulator, workers)
# are added in the phases that introduce them.
name: docflow-ai

services:
  api:
    build:
      context: .
      args:
        SERVICE: api
        VERSION: ${VERSION:-dev}
    image: docflow-ai/api:local
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: debug
      # No load balancer to drain from locally.
      SHUTDOWN_DRAIN_DELAY: 0s
