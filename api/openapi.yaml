openapi: 3.1.0
info:
  title: DocFlow AI API
  version: 0.1.0
  description: |
    Upload business documents for asynchronous processing and track their
    progress.

    Processing is asynchronous: `POST /documents` returns `202 Accepted`
    immediately, and clients poll `GET /documents/{id}/status` until the
    status is terminal (`COMPLETED`, `REVIEW_REQUIRED` or `FAILED`).

    Every response carries an `X-Request-ID` header. Errors use RFC 9457
    Problem Details (`application/problem+json`).
servers:
  - url: http://localhost:8080
    description: Local development

# No authentication yet; it is added in the security phase.
security: []

tags:
  - name: documents
    description: Upload documents and track their processing.
  - name: health
    description: Liveness and readiness probes for orchestrators and load balancers.

paths:
  /documents:
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a document for processing
      description: |
        The file type is detected from the file content; the declared
        `Content-Type` of the part is ignored. Accepted types are PDF, PNG
        and JPEG. The size limit is configured by `MAX_UPLOAD_BYTES`
        (20 MiB by default).
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The document. Must be sent with a file name.
      responses:
        "202":
          description: Document accepted for processing.
          headers:
            Location:
              description: URL of the new document.
              schema: { type: string, example: /documents/0192f7b4-9a3c-7d2e-8f41-3b6c5d7e8f90 }
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedType" }
        "500": { $ref: "#/components/responses/InternalError" }

  /documents/{id}:
    get:
      tags: [documents]
      operationId: getDocument
      summary: Get a document's metadata and status
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The document.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /documents/{id}/status:
    get:
      tags: [documents]
      operationId: getDocumentStatus
      summary: Get a document's processing status
      description: A small response intended for polling.
      parameters:
        - $ref: "#/components/parameters/DocumentID"
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The document's status.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /health:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      description: Succeeds while the process is serving. Never checks dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe
      description: |
        Succeeds when this replica should receive traffic. Fails while the
        server is draining for shutdown or when a dependency check fails.
      responses:
        "200":
          description: Ready for traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  parameters:
    DocumentID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Caller-supplied request ID, reused if it is at most 64 characters of
        letters, digits, `-`, `_` and `.`; otherwise a new ID is generated.
      schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$" }

  headers:
    RequestID:
      description: The ID of this request, also present in every related log line.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No document has this ID.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The document exceeds the size limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedType:
      description: The request is not multipart/form-data, or the document type is not accepted.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: An unexpected server error. Details are logged, not returned.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Status:
      type: string
      enum: [UPLOADED, QUEUED, PROCESSING, COMPLETED, REVIEW_REQUIRED, FAILED]
      description: |
        UPLOADED → QUEUED → PROCESSING → COMPLETED | REVIEW_REQUIRED | FAILED.
        COMPLETED, REVIEW_REQUIRED and FAILED are terminal.

    UploadAccepted:
      type: object
      required: [id, status, statusUrl]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/Status" }
        statusUrl: { type: string, example: /documents/0192f7b4-9a3c-7d2e-8f41-3b6c5d7e8f90/status }

    Document:
      type: object
      required: [id, fileName, contentType, sizeBytes, sha256, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, example: invoice-2026-0042.pdf }
        contentType: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        sizeBytes: { type: integer, format: int64 }
        sha256: { type: string, description: Hex-encoded SHA-256 of the content. }
        status: { $ref: "#/components/schemas/Status" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentStatus:
      type: object
      required: [id, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/Status" }
        updatedAt: { type: string, format: date-time }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, draining, unavailable] }
        failedChecks:
          type: array
          items: { type: string }
          description: Names of failing dependency checks. Details are only logged.

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Unsupported Media Type }
        status: { type: integer, example: 415 }
        detail: { type: string, example: "unsupported document type; accepted types are PDF, PNG and JPEG" }
        instance: { type: string, example: /documents }
        requestId: { type: string, example: 4FZOGA4YCNQBOOOZMHRMSRXJE4 }
